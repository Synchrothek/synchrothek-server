# Apache 2.4.47 oder neuer: /etc/apache2/sites-available/synchrothek.conf
# Server läuft lokal auf Port 8080 (compose.yaml mit SYNCHROTHEK_BIND=127.0.0.1, TRUST_PROXY=true).
#   a2enmod proxy proxy_http ssl && a2ensite synchrothek && systemctl reload apache2
# Zertifikat z. B. mit: certbot --apache -d sync.example.org
# (Ältere Apache-Versionen brauchen stattdessen mod_proxy_wstunnel und ProxyPass / ws://127.0.0.1:8080/)

<VirtualHost *:80>
    ServerName sync.example.org
    Redirect permanent / https://sync.example.org/
</VirtualHost>

<VirtualHost *:443>
    ServerName sync.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/sync.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sync.example.org/privkey.pem

    ProxyPreserveHost On
    # upgrade=websocket reicht WebSocket-Verbindungen durch, timeout hält sie offen
    ProxyPass        / http://127.0.0.1:8080/ upgrade=websocket timeout=3600
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
