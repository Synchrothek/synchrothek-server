# nginx: /etc/nginx/sites-available/synchrothek  (danach nach sites-enabled verlinken)
# Server läuft lokal auf Port 8080 (compose.yaml mit SYNCHROTHEK_BIND=127.0.0.1, TRUST_PROXY=true).
# Zertifikat z. B. mit: certbot --nginx -d sync.example.org

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sync.example.org;

    ssl_certificate     /etc/letsencrypt/live/sync.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket-Verbindungen bleiben lange offen
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
