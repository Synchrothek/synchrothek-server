# Ergänzung zu compose.yaml für einen Reverse Proxy, der selbst als Docker-Container läuft
# (z. B. Caddy, Traefik, nginx). Der Server veröffentlicht dann keinen Host-Port, der Proxy
# erreicht ihn im gemeinsamen Docker-Netzwerk unter synchrothek:8080.
#   In .env: COMPOSE_FILE=compose.yaml:compose.proxy.yaml und PROXY_NETWORK=<Netzwerk des Proxys>
services:
  synchrothek:
    ports: !reset []
    environment:
      TRUST_PROXY: "true"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Bitte PROXY_NETWORK setzen (Docker-Netzwerk des Reverse Proxys)}
