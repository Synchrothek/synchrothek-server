name: CI

# Tests und Typprüfung bei jedem Push und Pull Request.
# Push auf main oder Tag v*: Docker-Image nach ghcr.io (amd64 + arm64).
# Tag v*: zusätzlich npm-Paket @synchrothek/server auf npmjs.org, per Trusted
# Publishing (OIDC, kein Token im Repository) mit Provenance-Nachweis.
#
# Alle Actions sind auf einen Commit-SHA gepinnt (Version im Kommentar),
# Dependabot hält sie aktuell.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Paket bauen und Inhalt anzeigen
        run: npm pack --dry-run
      - name: Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: npm audit --omit=dev --audit-level=high

  image:
    # Baut das Docker-Image für amd64 und arm64 und veröffentlicht es in der GitHub Container Registry.
    # main → :main, Tag v1.2.3 → :1.2.3, :1.2, :1 und :latest
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/synchrothek/synchrothek-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    # Veröffentlicht @synchrothek/server auf npmjs.org. Voraussetzung: Auf npmjs.com ist für das
    # Paket ein Trusted Publisher mit Repository synchrothek/synchrothek-server und
    # Workflow-Datei ci.yml eingetragen. Die Version im Tag muss zu package.json passen.
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC-Token für Trusted Publishing und Provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Bewusst ohne Cache, damit kein Cache-Eintrag aus anderen Läufen in das Paket gelangt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Keine registry-url: npm nutzt ohnehin registry.npmjs.org, und ohne von setup-node
      # angelegte .npmrc gibt es keinen Token-Platzhalter, der dem OIDC-Austausch im Weg steht.
      - run: npm ci
      - name: Version prüfen
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG passt nicht zu package.json ($VERSION)"
            exit 1
          fi
          # Ist die Version schon veröffentlicht (z. B. beim allerersten, manuellen Publish),
          # wird der Schritt übersprungen statt fehlzuschlagen.
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION ist bereits auf npmjs.org, nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "npm $(npm --version) (Trusted Publishing braucht mindestens 11.5.1)"
      - name: Auf npmjs.org veröffentlichen
        if: steps.version.outputs.skip != 'true'
        run: npm publish --provenance --access public
